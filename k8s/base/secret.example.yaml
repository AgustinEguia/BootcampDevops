# secret.example.yaml
# ----------------------
# EJEMPLO de cómo se vería un Secret para esta app. Se llama
# "*.example.yaml" (no "*.yaml") a propósito para que NO se aplique por
# accidente con `kubectl apply -k` ni quede referenciado desde
# kustomization.yaml: es sólo material de referencia para que los alumnos
# vean la forma, y la copien a un secret.yaml real (gitignoreado, ver
# .gitignore) cuando lo necesiten.
#
# IMPORTANTE — esto es un ANTI-PATRÓN si se usa tal cual en producción:
# los valores de `data` en un Secret de Kubernetes están en base64, NO
# encriptados. Cualquiera con permiso de `kubectl get secret -o yaml`
# puede leerlos en texto plano con un simple `| base64 -d`. En un
# ambiente productivo real se debería usar una herramienta como
# Sealed Secrets, External Secrets Operator (con AWS Secrets Manager /
# Vault) o SOPS, para que los secretos ni siquiera pasen por el repo de
# git en ninguna forma.
apiVersion: v1
kind: Secret
metadata:
  name: demo-app-secrets
  labels:
    app.kubernetes.io/name: demo-app
type: Opaque
stringData:
  # stringData (en vez de data) nos deja escribir el valor en texto plano
  # acá y es Kubernetes quien lo convierte a base64 al aplicarlo. Sigue
  # siendo texto plano en este archivo, por eso NUNCA se debe commitear
  # un secret.yaml real con valores verdaderos.
  EXAMPLE_API_KEY: "<REEMPLAZAR_CON_VALOR_REAL_NUNCA_COMMITEAR>"
