# 10-build.yml
# -------------
# Jobs de la etapa "lint" (chequeos rápidos de estilo, antes de gastar
# tiempo en tests/build) y de la etapa "build" (armado y push de la
# imagen Docker).

# --- Stage: lint --------------------------------------------------------
# Ruff chequea el código Python (estilo + errores comunes). Es el primer
# job del pipeline a propósito: es el más rápido y así los alumnos reciben
# feedback en segundos si hay un error obvio, sin esperar a que corran
# tests o builds más pesados ("fail fast").
lint:ruff:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install --quiet ruff==0.6.9
  script:
    - ruff check app/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'

# Hadolint analiza el Dockerfile buscando malas prácticas (correr como
# root, no fijar versión de la imagen base, usar ADD en vez de COPY, etc).
# Usamos la imagen oficial de hadolint que ya trae el binario, así no hace
# falta instalar nada.
lint:hadolint:
  stage: lint
  image: hadolint/hadolint:v2.12.0-alpine
  script:
    - hadolint Dockerfile
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'

# --- Stage: build --------------------------------------------------------
# Construye la imagen y la pushea al Container Registry de GitLab.
# Usamos Docker-in-Docker (dind) como servicio: el job corre en un
# contenedor "cliente" de Docker que habla con un daemon Docker separado
# (el servicio docker:dind). Es el patrón estándar para buildear imágenes
# dentro de un pipeline que a su vez corre en contenedores.
build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    # Login al registry de GitLab usando las credenciales que GitLab
    # inyecta automáticamente en cada job (no hace falta guardar un
    # usuario/password como secret manual).
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
  script:
    - >
      docker build
      --build-arg APP_VERSION="${IMAGE_TAG_SHA}"
      -t "${IMAGE_NAME}:${IMAGE_TAG_SHA}"
      -t "${IMAGE_NAME}:${IMAGE_TAG_BRANCH}"
      .
    - docker push "${IMAGE_NAME}:${IMAGE_TAG_SHA}"
    - docker push "${IMAGE_NAME}:${IMAGE_TAG_BRANCH}"
    # Si estamos en la rama principal, además taggeamos "latest". OJO
    # pedagógico: usar `latest` en producción es una mala práctica (no es
    # reproducible, no sabés qué versión es realmente). Lo hacemos acá
    # sólo como conveniencia para pull rápidos en el ambiente de dev del
    # curso, y por eso la policy de Kyverno en security/policies bloquea
    # el tag `latest` en manifiestos "productivos".
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "${IMAGE_NAME}:${IMAGE_TAG_SHA}" "${IMAGE_NAME}:latest"
        docker push "${IMAGE_NAME}:latest"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG'
