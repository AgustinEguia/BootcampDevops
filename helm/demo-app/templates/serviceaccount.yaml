{{/*
serviceaccount.yaml
----------------------
Un ServiceAccount propio (en vez de usar el "default" del namespace) es
buena práctica: permite, en el futuro, atarle permisos RBAC específicos
(o un rol de IAM vía IRSA en EKS, ver terraform/30-eks) SIN afectar a
otras apps que compartan el namespace.
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "demo-app.serviceAccountName" . }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
