# sonar-project.properties
# ---------------------------
# Configuración del scanner de SonarQube (job sast:sonarqube en
# ci/gitlab/30-security.yml / stage 'sonarqube' del Jenkinsfile).
sonar.projectKey=devops-bootcamp-demo
sonar.projectName=DevOps Bootcamp Demo
sonar.projectVersion=1.0

# Dónde está el código fuente a analizar.
sonar.sources=app
sonar.tests=app/tests
sonar.python.version=3.11

# Le decimos a Sonar dónde encontrar el reporte de cobertura que ya generó
# pytest-cov (job test:pytest), para no re-ejecutar los tests dentro del
# análisis de Sonar.
sonar.python.coverage.reportPaths=app/coverage.xml

# Excluimos el propio código de tests del cálculo de duplicación/
# complejidad (sí lo usamos para cobertura, pero no tiene sentido medirle
# "code smells" con el mismo criterio que al código de producción).
sonar.coverage.exclusions=app/tests/**

# Encoding explícito: evita problemas de caracteres especiales (tildes,
# ñ) al analizar comentarios en español rioplatense.
sonar.sourceEncoding=UTF-8
